media:
  input: images
  output: /ibrahim-nauman/images

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Subtitle / meta description (max 160 characters)
        type: text
      - name: date
        label: Publish date
        type: date
        options:
          format: yyyy-MM-dd
      - name: cover
        label: Cover image
        type: image
        options:
          media: images
      - name: cover_alt
        label: Cover image alt text
        type: string
      - name: body
        label: Article
        type: rich-text
